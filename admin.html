<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAYAZ RECORDS — Admin</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #080808;
    color: #fff;
}

header {
    background: #111;
    border-bottom: 1px solid #d4af37;
    padding: 22px;
    text-align: center;
}

header h1 {
    margin: 0;
    color: #d4af37;
}

header p {
    margin: 8px 0 0;
    color: #aaa;
}

.container {
    width: 95%;
    max-width: 1200px;
    margin: 30px auto;
}

.refresh {
    background: #d4af37;
    color: #000;
    border: none;
    padding: 12px 20px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 20px;
}

.refresh:hover {
    opacity: .85;
}

.card {
    background: #111;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
}

.card h2 {
    color: #d4af37;
    margin-top: 0;
}

.order {
    border-top: 1px solid #333;
    padding: 18px 0;
}

.order:first-child {
    border-top: none;
}

.row {
    margin: 7px 0;
}

.label {
    color: #aaa;
}

.status {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 5px;
    font-weight: bold;
    font-size: 13px;
}

.pending {
    background: #5b4500;
    color: #ffd84d;
}

.verified {
    background: #123d20;
    color: #4cff7a;
}

.verify {
    background: #d4af37;
    color: #000;
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 10px;
}

.verify:hover {
    opacity: .85;
}

.download {
    display: inline-block;
    background: #d4af37;
    color: #000;
    padding: 12px 18px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
    margin-top: 12px;
}

.download:hover {
    opacity: .85;
}

.expiration {
    color: #ffd84d;
    margin-top: 8px;
}

.empty {
    color: #aaa;
    text-align: center;
    padding: 30px;
}

.error {
    color: #ff5c5c;
}

</style>

</head>

<body>

<header>

<h1>RAYAZ RECORDS</h1>

<p>Admin Panel — Commandes MVola</p>

</header>

<div class="container">

<button
class="refresh"
onclick="loadOrders()"

>

🔄 ACTUALISER LES COMMANDES </button>

<div class="card">

<h2>Commandes</h2>

<div id="orders">
Chargement...
</div>

</div>

</div>

<script>

const BACKEND_URL =
    "https://rayaz-beat-store.onrender.com";


async function loadOrders() {

    const container =
        document.getElementById("orders");

    container.innerHTML =
        "Chargement...";

    try {

        const response =
            await fetch(
                BACKEND_URL +
                "/api/orders"
            );

        const data =
            await response.json();

        if (!data.success) {
            throw new Error(
                "Erreur serveur"
            );
        }

        if (data.orders.length === 0) {

            container.innerHTML =
                '<div class="empty">Aucune commande.</div>';

            return;
        }

        container.innerHTML = "";

        data.orders
            .slice()
            .reverse()
            .forEach(order => {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "order";

                const statusClass =
                    order.status === "VERIFIED"
                    ? "verified"
                    : "pending";

                const statusText =
                    order.status === "VERIFIED"
                    ? "VERIFIED"
                    : "PENDING";


                let downloadHTML = "";


                if (
                    order.status ===
                    "VERIFIED" &&
                    order.downloadToken
                ) {

                    const link =
                        BACKEND_URL +
                        "/download/" +
                        order.downloadToken;

                    downloadHTML = `

                        <div class="expiration">
                            ⏱️ Lien valable 30 minutes
                        </div>

                        <a
                            class="download"
                            href="${link}"
                            target="_blank"
                        >
                            ⬇️ TÉLÉCHARGER LE BEAT
                        </a>

                    `;
                }


                div.innerHTML = `

                    <div class="row">
                        <span class="label">
                            ID :
                        </span>
                        ${order.id}
                    </div>

                    <div class="row">
                        <span class="label">
                            Client :
                        </span>
                        ${order.name}
                    </div>

                    <div class="row">
                        <span class="label">
                            Email :
                        </span>
                        ${order.email}
                    </div>

                    <div class="row">
                        <span class="label">
                            Beat :
                        </span>
                        ${order.beat}
                    </div>

                    <div class="row">
                        <span class="label">
                            License :
                        </span>
                        ${order.license}
                    </div>

                    <div class="row">
                        <span class="label">
                            Prix :
                        </span>
                        ${order.price}
                    </div>

                    <div class="row">
                        <span class="label">
                            MVola :
                        </span>
                        ${order.mvolaNumber}
                    </div>

                    <div class="row">
                        <span class="label">
                            Référence :
                        </span>

                        <strong>
                            ${order.transactionReference}
                        </strong>

                    </div>

                    <div class="row">

                        <span class="label">
                            Statut :
                        </span>

                        <span
                            class="status ${statusClass}"
                        >
                            ${statusText}
                        </span>

                    </div>

                    ${
                        order.status !==
                        "VERIFIED"

                        ?

                        `
                        <button
                            class="verify"
                            onclick="verifyOrder('${order.id}')"
                        >
                            ✅ VALIDER LE PAIEMENT
                        </button>
                        `

                        :

                        `
                        <div class="row">

                            <span
                                class="status verified"
                            >
                                ✅ PAIEMENT VALIDÉ
                            </span>

                        </div>
                        `
                    }

                    ${downloadHTML}

                `;

                container.appendChild(div);

            });

    }

    catch (error) {

        console.error(error);

        container.innerHTML =
            '<div class="error">' +
            'Impossible de contacter le backend.' +
            '</div>';

    }

}


async function verifyOrder(orderId) {

    const confirmation =
        confirm(
            "Confirmer la validation de ce paiement MVola ?"
        );

    if (!confirmation) {
        return;
    }


    try {

        const response =
            await fetch(
                BACKEND_URL +
                "/api/orders/" +
                orderId +
                "/verify",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    }
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            alert(
                "Erreur : " +
                data.message
            );

            return;
        }


        alert(
            "Paiement validé avec succès !\n\n" +
            "Le lien de téléchargement est valable 30 minutes."
        );


        loadOrders();

    }

    catch (error) {

        console.error(error);

        alert(
            "Impossible de contacter le backend."
        );

    }

}


loadOrders();

</script>

</body>
</html>
